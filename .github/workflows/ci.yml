name: CI Pipeline

# Trigger: run on push/PR to main, but ONLY when source code changes
on:
  push:
    branches: [ "main" ]
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches: [ "main" ]
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"

# WORKFLOW-LEVEL environment variables
env:
  NODE_ENV: test
  APP_NAME: github-actions-learning-api

jobs:
  test:
    runs-on: ubuntu-latest

    # JOB-LEVEL environment variables
    env:
      LOG_LEVEL: debug

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # ── LEVEL 9: Conditions ──────────────────────────────────────────────────

      # Runs ONLY on pull_request events — never on direct push
      - name: Show PR info
        if: github.event_name == 'pull_request'
        run: |
          echo "This is a PR run"
          echo "Actor: ${{ github.actor }}"
          echo "SHA:   ${{ github.sha }}"

      # Runs ONLY on direct push to main — never on PRs
      - name: Show push info
        if: github.event_name == 'push'
        run: |
          echo "This is a direct push to main"
          echo "Commit: ${{ github.sha }}"

      # Always runs — success or failure
      - name: Print run context
        if: always()
        run: |
          echo "Workflow: ${{ github.workflow }}"
          echo "Run #:    ${{ github.run_number }}"
          echo "Branch:   ${{ github.ref_name }}"

      # Run tests — the main step
      - name: Run tests
        id: tests
        env:
          TEST_REPORTER: verbose
        run: npm test

      # Runs ONLY if tests passed
      - name: Tests passed — ready to merge
        if: success()
        run: echo "✅ All tests passed. Safe to merge!"

      # Runs ONLY if tests failed
      - name: Tests failed — notify
        if: failure()
        run: |
          echo "❌ Tests failed!"
          echo "Triggered by: ${{ github.actor }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Check the logs above for details."
