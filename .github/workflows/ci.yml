name: CI Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches: [ "main" ]
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"

# ── LEVEL 15: Least Privilege Permissions ─────────────────────────────────────
# By default, lock down GITHUB_TOKEN to read-only access for repository code.
# Unspecified scopes (issues, pull-requests, packages, etc.) automatically drop to 'none'.
permissions:
  contents: read

env:
  NODE_ENV: test
  APP_NAME: github-actions-learning-api

# ── Pipeline DAG (Level 13 updated) ───────────────────────────────────────────
#
#                   ┌── test (Node 20) ──┐
#                   ├── test (Node 22) ──┤
# push ────────────►├── test (Node 24) ──┼──► build ──► deploy-check
#                   │                   │    (uploads   (downloads
#                   └── lint ───────────┘    artifact)   artifact)

jobs:

  # ── Job 1: test (matrix) ──────────────────────────────────────────────────
  test:
    name: "Test / Node ${{ matrix.node-version }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]

    env:
      LOG_LEVEL: debug

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: "Setup Node.js ${{ matrix.node-version }}"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Show Node version
        run: |
          echo "Testing on Node.js $(node --version)"
          echo "npm version: $(npm --version)"

      - name: Run tests
        id: tests
        run: npm test

      - name: Tests passed
        if: success()
        run: echo "✅ All tests passed on Node ${{ matrix.node-version }}!"

      - name: Tests failed
        if: failure()
        run: echo "❌ Tests failed on Node ${{ matrix.node-version }}!"

  # ── Job 2: lint ─────────────────────────────────────────────────────────────
  lint:
    name: Lint Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint (simulated)
        run: |
          echo "Running lint checks..."
          echo "Checking src/ for issues..."
          echo "✅ No lint errors found"

  # ── Job 3: build ────────────────────────────────────────────────────────────
  # LEVEL 13: builds the app, creates a real file, and uploads it as an artifact
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Create a real build output file to demonstrate artifacts
      - name: Build application
        run: |
          mkdir -p dist
          echo "Building ${{ env.APP_NAME }}..."
          echo "Triggered by: ${{ github.actor }}"
          echo "Commit: ${{ github.sha }}"

          # Write a build manifest file (simulates a real build output)
          cat > dist/build-info.json << EOF
          {
            "name": "${{ env.APP_NAME }}",
            "version": "1.0.0",
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "actor": "${{ github.actor }}",
            "run_number": ${{ github.run_number }},
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          echo "✅ Build complete — dist/ created"
          echo "--- dist/ contents ---"
          ls -la dist/
          cat dist/build-info.json

      # LEVEL 13: Upload the dist/ folder as an artifact
      # Name: "build-output" — this name is used to download it in other jobs
      # Path: dist/          — uploads everything inside dist/
      # retention-days: 7   — keep for 7 days (saves GitHub storage space)
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
          retention-days: 7

  # ── Job 4: deploy-check ─────────────────────────────────────────────────────
  # LEVEL 13: demonstrates downloading an artifact from a previous job
  # In a real CD pipeline, this would be the actual deployment job
  deploy-check:
    name: Deploy Check (Artifact Demo)
    runs-on: ubuntu-latest
    needs: build                 # must wait for build to upload the artifact

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output     # must match the upload name exactly
          path: ./release/       # where to place the downloaded files

      # Verify the artifact was downloaded correctly
      - name: Verify artifact contents
        run: |
          echo "=== Downloaded artifact contents ==="
          ls -la ./release/
          echo ""
          echo "=== Build info ==="
          cat ./release/build-info.json

      # Simulate a deployment step
      - name: Simulate deployment
        run: |
          echo "🚀 Deploying ${{ env.APP_NAME }}..."
          echo "Using artifact from: build job (run #${{ github.run_number }})"
          echo "✅ Deployment simulation complete"
