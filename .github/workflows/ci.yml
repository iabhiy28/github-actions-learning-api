name: CI Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches: [ "main" ]
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"

env:
  NODE_ENV: test
  APP_NAME: github-actions-learning-api

# ── Pipeline DAG ──────────────────────────────────────────────────────────────
#
#                   ┌── test (Node 20) ──┐
#                   ├── test (Node 22) ──┤
# push ────────────►├── test (Node 24) ──┼──► build
#                   │                   │
#                   └── lint ───────────┘
#
# Matrix creates 3 test jobs in parallel (one per Node version)
# build waits for ALL matrix jobs + lint to pass

jobs:

  # ── Job 1: test (matrix) ──────────────────────────────────────────────────
  # LEVEL 11: strategy.matrix creates multiple parallel jobs from one definition
  test:
    name: "Test / Node ${{ matrix.node-version }}"
    runs-on: ubuntu-latest

    strategy:
      # fail-fast: false → run ALL Node versions even if one fails
      # This lets us see the full compatibility picture
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]

    env:
      LOG_LEVEL: debug

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Use the matrix variable to install the correct Node version
      - name: "Setup Node.js ${{ matrix.node-version }}"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      # Print which Node version we are currently testing
      - name: Show Node version
        run: |
          echo "Testing on Node.js $(node --version)"
          echo "npm version: $(npm --version)"

      - name: Run tests
        id: tests
        run: npm test

      - name: Tests passed
        if: success()
        run: echo "✅ All tests passed on Node ${{ matrix.node-version }}!"

      - name: Tests failed
        if: failure()
        run: echo "❌ Tests failed on Node ${{ matrix.node-version }}!"

  # ── Job 2: lint ────────────────────────────────────────────────────────────
  # Single job — no matrix needed for lint
  lint:
    name: Lint Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run lint (simulated)
        run: |
          echo "Running lint checks..."
          echo "Checking src/ for issues..."
          echo "✅ No lint errors found"

  # ── Job 3: build ───────────────────────────────────────────────────────────
  # needs: test → waits for ALL matrix jobs (all 3 Node versions) to pass
  # needs: lint → waits for lint to pass
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: |
          echo "Building ${{ env.APP_NAME }}..."
          echo "Triggered by: ${{ github.actor }}"
          echo "Commit: ${{ github.sha }}"
          echo "✅ Build complete — all Node versions passed!"
