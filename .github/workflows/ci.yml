name: CI Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches: [ "main" ]
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"

env:
  NODE_ENV: test
  APP_NAME: github-actions-learning-api

# ── LEVEL 10: Multiple jobs with needs: ─────────────────────────────────────
#
# Execution order:
#
#          ┌── test ──┐
# push ───►│          ├──► build
#          └── lint ──┘
#
# test and lint run IN PARALLEL
# build runs only after BOTH test and lint pass

jobs:

  # ── Job 1: Run tests ────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    env:
      LOG_LEVEL: debug

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        id: tests
        run: npm test

      - name: Tests passed
        if: success()
        run: echo "✅ All tests passed!"

      - name: Tests failed
        if: failure()
        run: echo "❌ Tests failed! Actor ${{ github.actor }} on ${{ github.ref_name }}"

  # ── Job 2: Lint ─────────────────────────────────────────────────────────────
  # Runs IN PARALLEL with the test job (no needs: → starts immediately)
  lint:
    name: Lint Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # We don't have a real linter configured yet
      # This simulates what a lint step looks like
      - name: Run lint (simulated)
        run: |
          echo "Running lint checks..."
          echo "Checking src/ for issues..."
          echo "✅ No lint errors found"

  # ── Job 3: Build ────────────────────────────────────────────────────────────
  # Runs ONLY after BOTH test and lint succeed
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]          # ← depends on test AND lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: |
          echo "Building ${{ env.APP_NAME }}..."
          echo "Triggered by: ${{ github.actor }}"
          echo "Commit: ${{ github.sha }}"
          echo "✅ Build complete"
