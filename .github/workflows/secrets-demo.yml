name: Secrets Demo

# Trigger manually from the GitHub UI
on:
  workflow_dispatch:

jobs:
  secrets-demo:
    runs-on: ubuntu-latest

    steps:
      # ── How to USE a secret ─────────────────────────────────────────────────
      # NEVER put the secret value directly in run: commands
      # ALWAYS assign to an env var first, then use the env var
      - name: Use secret safely
        env:
          # ${{ secrets.DUMMY_API_KEY }} → injects the secret value at runtime
          # GitHub masks this value in all log output
          API_KEY: ${{ secrets.DUMMY_API_KEY }}
        run: |
          echo "Secret is set: ${{ secrets.DUMMY_API_KEY != '' }}"
          echo "Key length: ${#API_KEY} characters"
          echo "First char: ${API_KEY:0:1}..."
          echo "Deploying with API key (value is masked in logs)..."

      # ── What GitHub masks automatically ────────────────────────────────────
      # Even if you do this by accident, the value is replaced with ***
      - name: Accidental print (GitHub masks it)
        env:
          API_KEY: ${{ secrets.DUMMY_API_KEY }}
        run: |
          echo "If you print it: $API_KEY"
          echo "It appears as: ***  in the logs"

      # ── Checking if a secret exists (without revealing the value) ──────────
      - name: Check if secret is set
        env:
          API_KEY: ${{ secrets.DUMMY_API_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "❌ DUMMY_API_KEY secret is NOT set"
            echo "Go to: Settings → Secrets → Actions → New repository secret"
          else
            echo "✅ DUMMY_API_KEY secret is set and available"
          fi

      # ── GITHUB_TOKEN — the built-in automatic secret ────────────────────────
      # Every workflow automatically receives a GITHUB_TOKEN
      # It does NOT need to be added manually to Settings
      - name: Use built-in GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "GITHUB_TOKEN is automatically available in every workflow"
          echo "It is set: ${{ secrets.GITHUB_TOKEN != '' }}"
          echo "Use it to: interact with the GitHub API, push to repo, create releases"
